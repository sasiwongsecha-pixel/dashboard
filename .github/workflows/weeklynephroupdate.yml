name: Weekly nephrology update

# Fully automatic weekly refresh of the dashboard's Nephrology tab:
#   1. fetch_nephro.py     - query PubMed for the week's newly-indexed trials
#   2. summarize_nephro.py - Gemini writes summary / PICO / appraisal per article
#   3. commit nephro.json  - GitHub Pages serves it, so the tab updates itself
#
# No human step, no cost: one request a week sits far inside Gemini's free tier.
# Requires the repository secret GEMINI_API_KEY.

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:       # allow running on demand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Gather this week's PubMed nephrology trials
        id: fetch
        run: python scripts/fetch_nephro.py

      # A truncated or half-pasted fetch_nephro.py still parses as valid Python:
      # it defines functions, never calls main(), exits 0 and sets no output.
      # Without this guard the later steps are silently skipped and the run looks green.
      - name: Verify the gatherer actually ran
        env:
          COUNT: ${{ steps.fetch.outputs.count }}
        run: |
          if [ -z "$COUNT" ]; then
            echo "::error::fetch_nephro.py set no 'count' output, so it did not run to completion. The most likely cause is an incomplete copy of the script - re-upload the full file."
            exit 1
          fi
          echo "Gatherer reported $COUNT article(s)."

      - name: Write summaries and appraisals
        if: steps.fetch.outputs.count != '0'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::error::GEMINI_API_KEY secret is not set. Add it under Settings - Secrets and variables - Actions."
            exit 1
          fi
          python scripts/summarize_nephro.py

      - name: Publish the updated feed
        if: steps.fetch.outputs.count != '0'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nephro.json
          if git diff --cached --quiet; then
            echo "nephro.json unchanged - nothing to publish."
            exit 0
          fi
          git commit -m "chore: weekly nephrology update ($(date -u +%Y-%m-%d))"
          git push
